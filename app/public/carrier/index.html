<title>Laurelshield · Carrier Console</title>
<link rel="icon" type="image/png" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/favicon-180.png">
<link rel="stylesheet" href="/css/style.css">
<script>(function(){try{if(localStorage.getItem('ls-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<div class="topbar">
  <div class="brand"><img class="logo" src="/img/logo-topbar.png" alt="" /><span class="word">Laurelshield</span><span class="tagline">Carrier Console</span></div>
  <div class="who"><span id="whoami"></span><button class="logout" id="logoutBtn">Sign out</button></div>
</div>
<div class="shell">
  <div class="sidebar">
    <button class="navitem active" data-section="portfolio">Portfolio</button>
    <button class="navitem" data-section="suppliers">Supplier Concentration</button>
    <button class="navitem" data-section="claims">Claim Evidence Packs</button>
    <button class="navitem" data-section="account">Account Settings</button>
  </div>
  <div class="main">
    <div class="section active" id="sec-portfolio"></div>
    <div class="section" id="sec-suppliers"></div>
    <div class="section" id="sec-claims"></div>
    <div class="section" id="sec-account"></div>
  </div>
</div>
<div id="toast"></div>
<script src="/js/api.js"></script>
<script src="/carrier/app.js"></script>
